[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-mermaid-erd"
dynamic = ["version"]
description = "Graphviz-free Django ER diagrams: render your models as Mermaid text that GitHub, GitLab, Notion and Obsidian display natively."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "ARON" }]
keywords = ["django", "mermaid", "erd", "er-diagram", "models", "documentation", "uml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = ["Django>=3.2"]

[project.urls]
Homepage = "https://github.com/Aaron-lab-c/django-mermaid-erd"
Source = "https://github.com/Aaron-lab-c/django-mermaid-erd"
Issues = "https://github.com/Aaron-lab-c/django-mermaid-erd/issues"
Changelog = "https://github.com/Aaron-lab-c/django-mermaid-erd/blob/main/CHANGELOG.md"

[project.scripts]
mermaid-erd = "django_mermaid_erd.cli:main"

[tool.hatch.version]
path = "src/django_mermaid_erd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_mermaid_erd"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
